# Drop-in for this home appliance: fresh persistent collection from the recorded cutover.
[Service]
SupplementaryGroups=pihole
ReadOnlyPaths=/etc/pihole /var/lib/omega-wazuh-import
MemoryMax=768M
Nice=10
CPUQuota=150%
ExecStart=
ExecStart=/usr/bin/python3 -B /opt/omega-dashboard/server.py --port 8089 --password-file /var/lib/omega-dashboard/password --ai-model qwen3:1.7b --pihole-database /etc/pihole/pihole-FTL.db --device-state /var/lib/omega-dashboard/devices.json --protection-state /var/lib/omega-dashboard/protection.json --device-scan /var/lib/omega-dashboard/network-scan.json --device-inventory /var/lib/omega-dashboard/inventory.csv --telemetry-state /var/lib/omega-dashboard/live/telemetry.sqlite3 --from-now --wazuh-alerts /var/lib/omega-wazuh-import/alerts/alerts.json --wazuh-archives /var/lib/omega-wazuh-import/archives/archives.json --wazuh-sync-status /var/lib/omega-wazuh-import/sync-status.json --retention-days 3650 --max-events 50000000

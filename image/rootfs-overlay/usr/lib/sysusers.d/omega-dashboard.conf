# Persistent service identities; no login credentials or fixed customer IDs.
g omega-telemetry -
u omega-dashboard - "OMEGA dashboard" /var/lib/omega-dashboard /usr/sbin/nologin
u omega-ai - "OMEGA local AI" /var/lib/omega-ai /usr/sbin/nologin
u omega-mirror - "OMEGA Wazuh mirror" /var/lib/omega-wazuh-mirror /usr/sbin/nologin
m omega-dashboard omega-telemetry
m omega-mirror omega-telemetry

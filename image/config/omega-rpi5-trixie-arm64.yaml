  timezone: UTC

artefact:
  version: omega-v1

layer:
  base: omega-trixie-minbase

fs:
  ext4_mkfs_args: "-F -b 16384 -E hash_seed=bd67750e-9777-5c69-b79e-ee0d454fbe92"
